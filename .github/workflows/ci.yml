name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan complete fetched history
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact=100 --no-banner --timeout 120'

  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Pilot one real receipt transport regression
        shell: bash
        run: |
          set -euo pipefail
          cpu=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          log=$(mktemp "$RUNNER_TEMP/receipt-transport.XXXXXX")
          if (
            ulimit -f 64
            ulimit -c 0
            PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/tests" \
              /usr/bin/time -v timeout --signal=TERM --kill-after=2s 30s \
              taskset -c "$cpu" prlimit --as=805306368 --nproc=64 --nofile=256 --cpu=20 -- \
              python -m unittest -v \
              test_release_verify_runner_transport.RunnerTransportTests.test_idle_authorized_tls_tunnel_does_not_starve_create
          ) >"$log" 2>&1; then status=0; else status=$?; fi
          cat "$log"
          rm -- "$log"
          exit "$status"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.python == '3.11'
        with:
          node-version: '24'
      - name: Pilot and exercise real Node receipt entry
        if: matrix.python == '3.11'
        shell: bash
        run: |
          set -euo pipefail
          cpu=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          node --version
          run_node() {
            local log status
            log=$(mktemp "$RUNNER_TEMP/receipt-node.XXXXXX")
            if (
              ulimit -f 64
              ulimit -c 0
              /usr/bin/time -v timeout --signal=TERM --kill-after=2s 30s \
                taskset -c "$cpu" prlimit --as=805306368 --nproc=64 --nofile=256 --cpu=20 -- \
                node --jitless --disable-wasm-trap-handler --max-old-space-size=64 \
                --test --test-isolation=none --test-reporter=tap "$@" tests/test_release_verify_runner_dispatch.mjs
            ) >"$log" 2>&1; then status=0; else status=$?; fi
            cat "$log"
            rm -- "$log"
            return "$status"
          }
          run_node --test-name-pattern='terminal record remains readable'
          run_node
      - name: Install package and build tools
        run: python -m pip install --disable-pip-version-check . build
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Install optional adapter runner
        run: python -m pip install --disable-pip-version-check ./adapter_runner
      - name: Run optional adapter contract suite
        run: python -m unittest discover -s adapter_runner/tests -t adapter_runner -v
      - name: Build wheel
        run: python -m build --wheel
      - name: Exercise installed wheel outside source checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          smoke=$(mktemp -d "$RUNNER_TEMP/dotunnel-smoke.XXXXXX")
          mkdir -m 700 "$smoke/workspace"
          printf '{"root":"%s/workspace","file_access":{"read":[],"write":[]},"tasks":[]}\n' "$smoke" > "$smoke/config.json"
          chmod 600 "$smoke/config.json"
          cd "$smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/dotunnel" help
          "$RUNNER_TEMP/wheel-smoke/bin/dotunnel" serve --config "$smoke/config.json" --check-config
      - name: Build optional adapter wheel
        run: python -m build --wheel adapter_runner --outdir "$RUNNER_TEMP/adapter-dist"
      - name: Exercise installed optional wheel outside source checkout
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP/adapter-dist"/*.whl
          smoke=$(mktemp -d "$RUNNER_TEMP/adapter-smoke.XXXXXX")
          export ADAPTER_FIXTURE="$GITHUB_WORKSPACE/adapter_runner/tests/backend_fixture.py"
          export ADAPTER_SMOKE="$smoke"
          cd "$smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import dotunnel_adapter

          base = Path(os.environ["ADAPTER_SMOKE"])
          private = base / "private"
          workspace = base / "workspace"
          state = private / "state"
          for path in (private, workspace, state):
              path.mkdir(mode=0o700)
          backend = private / "backend.py"
          shutil.copyfile(os.environ["ADAPTER_FIXTURE"], backend)
          backend.chmod(0o400)
          backend_state = private / "backend-state.json"
          backend_state.write_text(json.dumps({"effects": 0, "mode": "zero_exit_only"}))
          backend_state.chmod(0o600)
          executable = Path("/usr/bin/python3").resolve(strict=True)
          config = private / "config.json"
          config.write_text(json.dumps({
              "protocol": "dotunnel.adapter.config/1",
              "workspace": str(workspace), "request": "pending.json",
              "reports": "reports", "state_dir": str(state),
              "project": {"id": "demo", "generation": "project-1", "protected": False,
                          "write_enabled": False, "operations": ["read_output"]},
              "backend": {"id": "fixture-backend", "generation": "backend-1",
                          "version": "1.0.0",
                          "digest": "sha256:" + hashlib.sha256(executable.read_bytes()).hexdigest(),
                          "argv": [str(executable), str(backend), str(backend_state)],
                          "timeout_seconds": 10},
          }))
          config.chmod(0o600)
          runner = str(Path(sys.executable).parent / "dotunnel-adapter-runner")
          def command(action):
              return subprocess.run([runner, action, "--config", str(config)],
                                    check=True, capture_output=True, text=True, timeout=30)
          owner = json.loads(command("initialize").stdout)["owner"]
          pending = workspace / "pending.json"
          pending.write_text(json.dumps({
              "protocol": "dotunnel.adapter/1", "request_id": "wheel-read",
              "action": "read_output", "owner": owner,
              "project": {"id": "demo", "generation": "project-1"},
              "backend": {"id": "fixture-backend", "generation": "backend-1"},
              "target": {"kind": "agent", "id": "agent-1", "incarnation": "generation-1"},
          }))
          pending.chmod(0o600)
          summary = json.loads(command("run").stdout)
          raw = (workspace / summary["report"]).read_bytes()
          assert hashlib.sha256(raw).hexdigest() == summary["sha256"]
          report = json.loads(raw)
          assert report["request_id"] == "wheel-read"
          assert report["status"]["job_state"] == "outcome_unknown"
          assert json.loads(backend_state.read_text())["effects"] == 0
          assert not pending.exists()
          assert not Path(dotunnel_adapter.__file__).resolve().is_relative_to(Path(os.environ["GITHUB_WORKSPACE"]))
          print("INSTALLED_ADAPTER_WHEEL_SMOKE=True")
          PY
